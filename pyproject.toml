[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disko-cli"
version = "0.1.0"
description = "Local disk auditing and explicit, recoverable cleanup for agents"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
disko = "disko_cli.cli:main"

[tool.setuptools.packages.find]
include = ["disko_cli*"]
