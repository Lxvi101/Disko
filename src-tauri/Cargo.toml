[package]
name = "disko"
version = "1.0.0"
description = "Disko: get your Mac back to factory fresh"
authors = ["Levi B"]
license = "MIT"
edition = "2021"

[lib]
name = "disko_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.12.0"
tauri-plugin-process = "2.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
disko-core = { path = "crates/core" }
disko-engine = { path = "crates/engine" }
disko-clutter = { path = "crates/clutter" }
disko-apps = { path = "crates/apps" }
disko-memory = { path = "crates/memory" }
disko-mcp = { path = "crates/mcp" }
disko-macos = { path = "crates/macos" }

[profile.release]
lto = "thin"
codegen-units = 4

[workspace]
members = [".", "crates/*"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
rayon = "1"
plist = "1"
